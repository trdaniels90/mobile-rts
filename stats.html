<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Red Horizon stats</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<style>
  body{margin:0;background:#111;color:#e8e8e8;font:15px/1.4 system-ui,sans-serif;padding:16px;max-width:900px;margin:auto}
  h1{font-family:Georgia,serif;font-weight:normal;margin:8px 0}
  h2{font-size:16px;margin:0 0 8px}
  .sub{color:#999;font-size:13px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
  .card{background:#1c1c1c;border-radius:10px;padding:14px;margin-bottom:14px}
  .tiles .card{margin:0}
  .big{font:28px Georgia,serif}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:5px 6px;white-space:nowrap}
  th{color:#999;font-weight:normal;font-size:13px}
  tr+tr td{border-top:1px solid #262626}
  .scroll{overflow-x:auto}
  .bars{display:flex;align-items:flex-end;gap:2px;height:120px}
  .bars div{flex:1;background:#2f80ed;min-height:1px;border-radius:2px 2px 0 0}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3c3;margin-right:6px}
  #err{color:#f66}
  #latest tr+tr{cursor:pointer}#latest tr+tr:hover td{background:#242424}
  .pick td{background:#2a2a2a}
  svg{width:100%;height:150px;display:block;margin:4px 0 10px}
  .key{font-size:13px;margin-bottom:12px}.key i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 10px}
  .ahead{color:#6c6}.behind{color:#e66}
</style>
</head>
<body>
<h1>Red Horizon stats</h1>
<div class="sub" id="line">Loading…</div>
<div id="err"></div>
<div class="tiles" id="tiles"></div>
<div class="card"><h2>Wins and losses by side and difficulty</h2><div class="sub">Against the computer, all time. Win rate counts wins and losses only.</div>
  <div class="scroll"><table id="results"></table></div></div>
<div class="card"><h2>Matches per day</h2><div class="sub">Last 30 days (Central time)</div><div class="bars" id="bars"></div>
  <div class="sub" id="barlabels" style="display:flex;justify-content:space-between"></div></div>
<div class="card"><h2>Latest matches</h2><div class="scroll"><table id="latest"></table></div></div>
<div class="card" id="debrief"><h2>Match debrief</h2><div class="sub">Tap a row in Latest matches to open its debrief.</div><div id="dbody"></div></div>
<script>
const URL_ = 'https://yorrgemlhoxbxvyvzcwe.supabase.co/rest/v1/rpc/public_stats';
const URL_M = 'https://yorrgemlhoxbxvyvzcwe.supabase.co/rest/v1/rpc/public_match';
const ANON = 'sb_publishable_FkCzdcgsEyqNy_UwmajBiQ_kp8V2Vi6';
const key = new URLSearchParams(location.hash.slice(1)).get('k') || '';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clock = (s) => s == null ? '' : Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
const money = (n) => '$' + Number(n).toLocaleString();
function chart(samples, a, b, label) {
  const W = 600, H = 150, mx = Math.max(1, ...samples.flatMap((x) => [x[a] || 0, x[b] || 0])), tm = Math.max(1, samples[samples.length - 1].t);
  const line = (k, c) => '<polyline fill="none" stroke="' + c + '" stroke-width="2" points="' + samples.map((x) => (x.t / tm * W).toFixed(1) + ',' + (H - 4 - (x[k] || 0) / mx * (H - 8)).toFixed(1)).join(' ') + '"/>';
  return '<div class="sub">' + label + ' (peak ' + mx.toLocaleString() + ', ' + clock(tm) + ')</div><svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' + line(a, '#2f80ed') + line(b, '#e5484d') + '</svg>';
}
let picked = null, last = null;
async function openMatch(id) {
  picked = id;
  document.querySelectorAll('#latest tr[data-m]').forEach((tr) => tr.classList.toggle('pick', tr.dataset.m === id));
  const res = await fetch(URL_M, { method: 'POST', headers: { apikey: ANON, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_key: key, p_id: id }) });
  const m = res.ok ? await res.json() : null;
  if (!m) { $('dbody').innerHTML = '<div class="sub">No debrief for this match (the app was closed, or it is an older version).</div>'; return; }
  const out = m.result === 'win' ? 'Mission accomplished' : m.result === 'loss' ? 'Mission failed' : m.result === 'quit' ? 'Quit' : 'Unfinished';
  let h = '<div style="margin:6px 0 10px"><b>' + esc(out) + '</b> · ' + esc(m.side) + ' vs ' + esc(m.enemy_side) + ' · ' + esc(m.difficulty) + ' · ' + clock(m.duration_s) +
    '<div class="sub">' + esc(m.match) + ' · ' + esc(m.started) + ' · ' + esc(m.name) + ' · ' + esc(m.version) + '</div></div>';
  h += '<div class="scroll"><table><tr><th></th><th>You</th><th>Enemy</th></tr>' + m.score.map((r) => {
    const f = (n) => r.money ? money(n) : Number(n).toLocaleString(), c = r.you === r.enemy ? '' : (r.you < r.enemy) === r.low ? 'ahead' : 'behind';
    return '<tr><td>' + esc(r.measure) + '</td><td class="' + c + '">' + f(r.you) + '</td><td>' + f(r.enemy) + '</td></tr>';
  }).join('') + '</table></div>';
  if (m.samples.length > 1) {
    h += '<h2 style="margin-top:14px">Strength over the match</h2><div class="key"><i style="background:#2f80ed"></i>You<i style="background:#e5484d"></i>Enemy</div>' +
      chart(m.samples, 'army_you', 'army_enemy', 'Army value') + chart(m.samples, 'inc_you', 'inc_enemy', 'Income per minute') + chart(m.samples, 'blds_you', 'blds_enemy', 'Buildings');
  }
  if (m.mvp && m.mvp.kills > 0) h += '<h2>MVP</h2><div style="margin-bottom:12px">' + esc(m.mvp.unit) + ': ' + m.mvp.kills + ' kills (' + money(m.mvp.worth) + ' of enemy value) · ' +
    (m.mvp.died == null ? 'survived' : 'fell at ' + clock(Math.round(m.mvp.died))) + '</div>';
  if (m.kills.length) h += '<h2>Kills by unit</h2><div class="scroll" style="margin-bottom:12px"><table>' + m.kills.map((k) => '<tr><td>' + esc(k.unit) + '</td><td>' + k.kills + '</td></tr>').join('') + '</table></div>';
  if (m.moments.length) h += '<h2>Key moments</h2><div class="scroll"><table>' + m.moments.map((k) => '<tr><td>' + clock(k.t) + '</td><td>' + esc(k.moment) + '</td></tr>').join('') + '</table></div>';
  $('dbody').innerHTML = h;
}
$('latest').addEventListener('click', (e) => { const tr = e.target.closest('tr[data-m]'); if (tr) openMatch(tr.dataset.m); });
const rows = (head, body) => '<tr>' + head.map((h) => '<th>' + h + '</th>').join('') + '</tr>' +
  body.map((r) => '<tr>' + r.map((c) => '<td>' + esc(c) + '</td>').join('') + '</tr>').join('');

async function load() {
  try {
    if (!key) throw new Error('This link is missing its key (the part after #k=).');
    const res = await fetch(URL_, { method: 'POST', headers: { apikey: ANON, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_key: key }) });
    if (!res.ok) throw new Error(res.status === 400 || res.status === 401 || res.status === 403 ? 'The key in this link was refused.' : 'Could not load (' + res.status + ').');
    const d = await res.json(), h = d.headline;
    $('err').textContent = '';
    $('line').textContent = h.playing_now + ' playing right now, and ' + h.matches_this_week + ' matches from ' + h.players_this_week + ' devices this week. Updated ' + new Date().toLocaleTimeString() + '.';
    $('tiles').innerHTML = [
      ['<span class="dot"></span>Playing right now', h.playing_now],
      ['Matches today', h.matches_today],
      ['Matches this week', h.matches_this_week],
      ['Average match length', clock(h.avg_length_s)],
    ].map(([t, v]) => '<div class="card"><div class="sub">' + t + '</div><div class="big">' + esc(v) + '</div></div>').join('');
    $('results').innerHTML = rows(['Side · difficulty', 'Wins', 'Losses', 'Quits', 'Win rate %', 'Avg length'],
      d.results.map((r) => [r.side + ' · ' + r.difficulty, r.wins, r.losses, r.quits,
        r.wins + r.losses ? Math.round(100 * r.wins / (r.wins + r.losses)) : '', clock(r.avg_s)]));
    const max = Math.max(1, ...d.perday.map((x) => x.matches));
    $('bars').innerHTML = d.perday.map((x) => '<div title="' + x.day + ': ' + x.matches + '" style="height:' + (100 * x.matches / max) + '%"></div>').join('');
    $('barlabels').innerHTML = '<span>' + d.perday[0].day.slice(5) + '</span><span>max ' + max + '/day</span><span>' + d.perday[d.perday.length - 1].day.slice(5) + '</span>';
    $('latest').innerHTML = rows(['Match', 'Started (Central)', 'Side', 'Difficulty', 'Outcome', 'Length', 'Name', 'Version'],
      d.latest.map((r) => [r.match, r.started, r.side, r.difficulty, r.outcome, clock(r.duration_s), r.name, r.version]));
    document.querySelectorAll('#latest tr').forEach((tr, i) => { if (i) tr.dataset.m = d.latest[i - 1].match; });
    if (!picked) { const f = d.latest.find((r) => r.outcome === 'Win' || r.outcome === 'Loss') || d.latest[0]; if (f) openMatch(f.match); }
    else document.querySelectorAll('#latest tr[data-m]').forEach((tr) => tr.classList.toggle('pick', tr.dataset.m === picked));
  } catch (e) { $('line').textContent = ''; $('err').textContent = e.message; }
}
load(); setInterval(load, 30000);
</script>
</body>
</html>
